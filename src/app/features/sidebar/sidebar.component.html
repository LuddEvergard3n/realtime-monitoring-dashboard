<!--
  Sidebar with filter controls.
  
  Design: Grouped sections for severity and source filters.
  Clear visual hierarchy with headings and spacing.
-->

<div class="sidebar">
  <!-- Header -->
  <div class="sidebar__header">
    <h3 class="sidebar__title">Filters</h3>
    
    <!-- Clear filters button (shown only when filters are active) -->
    @if (hasActiveFilters()) {
      <button 
        class="sidebar__clear-btn"
        (click)="clearFilters()"
        type="button">
        Clear all
      </button>
    }
  </div>
  
  <!-- Severity filters section -->
  <section class="filter-section">
    <h4 class="filter-section__title">Severity</h4>
    
    <div class="filter-section__options">
      @for (severity of severities; track severity) {
        <label 
          class="filter-checkbox"
          [ngClass]="getSeverityClass(severity)">
          <input 
            type="checkbox"
            [checked]="isSeverityActive(severity)"
            (change)="toggleSeverity(severity)"
            class="filter-checkbox__input" />
          <span class="filter-checkbox__label">{{ severity }}</span>
        </label>
      }
    </div>
  </section>
  
  <!-- Source filters section -->
  <section class="filter-section">
    <h4 class="filter-section__title">Source</h4>
    
    <!-- No sources available state -->
    @if (availableSources().length === 0) {
      <p class="filter-section__empty">No sources available</p>
    }
    
    <!-- Source checkboxes -->
    <div class="filter-section__options">
      @for (source of availableSources(); track source) {
        <label class="filter-checkbox">
          <input 
            type="checkbox"
            [checked]="isSourceActive(source)"
            (change)="toggleSource(source)"
            class="filter-checkbox__input" />
          <span class="filter-checkbox__label">{{ source }}</span>
        </label>
      }
    </div>
  </section>
</div>
